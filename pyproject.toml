[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "asken-scraper"
version = "0.1.0"
description = "Export your own Asken food and health records to JSON and CSV."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["playwright>=1.51,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
asken-scraper = "asken_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asken_scraper"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads your Asken account; opt in with ASKEN_LIVE_DATE and ASKEN_STATE"]
